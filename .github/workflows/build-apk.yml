name: Build Screenshot Bridge APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-screenshot-bridge/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-screenshot-bridge
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Build release APK (Gradle, no wrapper needed)
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android-screenshot-bridge
          arguments: assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-bridge-apk
          path: android-screenshot-bridge/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

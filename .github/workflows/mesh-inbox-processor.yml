name: Mesh inbox processor

# Consumer for the Telegram -> GitHub -> agent -> outbox -> Telegram loop.
# - process: scans inbox/*/ for new envelopes, validates, tracks seen IDs.
# - deliver: sends outbox/michael/ results via Telegram (needs secrets).
#
# Delivery semantics: AT-LEAST-ONCE, not exactly-once.
# If a Telegram send succeeds but the subsequent git push fails (all 5 retries
# exhausted), the delivery state is not persisted and the next run will re-send.
# This is the safe failure direction (duplicate is better than lost), but it means
# Michael may occasionally receive a duplicate message. The retry logic minimizes
# this window but cannot eliminate it — exactly-once delivery would require a
# transactional outbox or Telegram-side dedup, neither of which exists here.
# Mitigation: keep outbox payloads idempotent (include task_id so duplicates are
# recognizable) and keep the push retry loop tight.
#
# Required repository secrets (Settings -> Secrets -> Actions):
#   TELEGRAM_BOT_TOKEN : bot token for outbox delivery
#   TELEGRAM_CHAT_ID   : Michael's Telegram chat id
# Without them, deliver skips gracefully; process still runs.

on:
  push:
    paths:
      - 'inbox/**'
  schedule:
    - cron: '*/15 * * * *'  # backup sweep every 15 min
  workflow_dispatch:

permissions:
  contents: write  # move inbox files to done/, update mesh/processed.json

concurrency:
  group: mesh-inbox-processor
  cancel-in-progress: false  # never cancel a run; prevents duplicate processing

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Process inbox
        run: python3 mesh/inbox_processor.py process
      - name: Commit processed state
        run: |
          git config user.name "mesh-processor"
          git config user.email "mesh-processor@users.noreply.github.com"
          git add mesh/processed.json
          git diff --cached --quiet || git commit -m "mesh: process inbox $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Push with retry: fetch, rebase, push. Abort visibly on rebase conflict.
          # Never suppress a failed rebase or push.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "REBASE CONFLICT on attempt $attempt — aborting, failing visibly"
              git rebase --abort
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              break
            fi
            echo "Push rejected on attempt $attempt (transient race), retrying in 5s..."
            sleep 5
            if [ "$attempt" -eq 5 ]; then
              echo "Push failed after 5 attempts — failing visibly"
              exit 1
            fi
          done

  deliver:
    runs-on: ubuntu-latest
    needs: process
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deliver outbox via Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 mesh/inbox_processor.py deliver
      - name: Commit delivery state
        run: |
          git config user.name "mesh-processor"
          git config user.email "mesh-processor@users.noreply.github.com"
          git add mesh/processed.json outbox/
          git diff --cached --quiet || git commit -m "mesh: deliver outbox $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Push with retry: fetch, rebase, push. Abort visibly on rebase conflict.
          # Never suppress a failed rebase or push.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "REBASE CONFLICT on attempt $attempt — aborting, failing visibly"
              git rebase --abort
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              break
            fi
            echo "Push rejected on attempt $attempt (transient race), retrying in 5s..."
            sleep 5
            if [ "$attempt" -eq 5 ]; then
              echo "Push failed after 5 attempts — failing visibly"
              exit 1
            fi
          done
